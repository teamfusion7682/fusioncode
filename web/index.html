<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="frcsim-mode" content="dev">
  <title>FRC Web Simülatör</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>FRC Web Simülatör</h1>
      <span class="tag">Gerçek WPILib Java kodu</span>
    </div>
    <div class="controls">
      <label class="dev-only">Mod
        <select id="mode">
          <option value="autonomous">Otonom</option>
          <option value="teleop">Teleop</option>
        </select>
      </label>
      <label class="dev-only">Süre
        <input id="duration" type="number" min="1" max="60" value="6"> s
      </label>
      <span id="choosers" class="choosers dev-only"></span>
      <label class="static-only">Senaryo
        <select id="scenario"></select>
      </label>
      <button id="btn-all" class="ghost static-only" title="Tüm senaryoları yeniden yükle ve üst üste göster">Hepsini karşılaştır</button>
      <button id="run" class="primary" title="Ctrl+Enter">▶ Çalıştır</button>
    </div>
    <div class="menu dev-only">
      <button id="btn-example" class="ghost" title="Örnek projeyi geri yükle">Örneğe dön</button>
      <button id="btn-save" class="ghost" title="Projeyi .json olarak indir">İndir</button>
      <button id="btn-load" class="ghost" title="Daha önce indirilen projeyi yükle">Yükle</button>
      <input id="file-load" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="pane editor-pane" aria-label="Kod editörü">
      <div id="static-note" class="note static-only"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="editor-wrap">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="code">
          <pre id="hl" aria-hidden="true"></pre>
          <textarea id="code" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" aria-label="Kod"></textarea>
        </div>
      </div>
      <div class="teleop-box" id="teleop-box" hidden>
        <label for="joystick">Teleop joystick senaryosu <small>(t: saniye, axes: 0 solX · 1 solY · 4 sağX)</small></label>
        <textarea id="joystick" spellcheck="false" rows="3"></textarea>
      </div>
      <div class="console-head">
        <span id="status" role="status" aria-live="polite">Hazır</span>
        <button id="btn-clear" class="ghost small">Temizle</button>
      </div>
      <pre id="console" class="console" aria-label="Konsol"></pre>
    </section>

    <section class="pane sim-pane" aria-label="Simülasyon">
      <div class="canvas-box field-box">
        <canvas id="field" aria-label="Saha görünümü"></canvas>
        <div class="empty" id="empty">Kodu çalıştırınca robot burada hareket eder.</div>
      </div>

      <div class="playback">
        <button id="play" class="ghost" aria-label="Oynat / duraklat">▶</button>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Zaman">
        <span id="time" class="mono">0.00 / 0.00 s</span>
        <select id="speed" aria-label="Hız">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>

      <div class="chart-head">
        <label>Grafik <select id="chart-key"></select></label>
        <div id="runs" class="runs" aria-label="Çalıştırmalar"></div>
      </div>
      <div class="canvas-box chart-box">
        <canvas id="chart" aria-label="Grafik"></canvas>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
